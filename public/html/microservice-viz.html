<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservice Architecture Visualization</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 2rem; color: #333; }
        h1, h2 { color: #111; }
        .controls { display: flex; gap: 1rem; margin-bottom: 2rem; background: #f4f4f4; padding: 1rem; border-radius: 8px; }
        .btn { padding: 0.5rem 1rem; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; }
        .btn.active { background: #326ce5; color: white; border-color: #326ce5; }

        .viz-container { border: 1px solid #ddd; border-radius: 8px; padding: 2rem; background: white; min-height: 400px; display: flex; justify-content: center; align-items: center; }

        /* Node styles */
        .node { stroke: #333; stroke-width: 2px; cursor: pointer; transition: all 0.2s; }
        .node:hover { stroke: #000; stroke-width: 3px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }

        /* Edge styles */
        .edge { stroke: #999; stroke-width: 2px; fill: none; transition: all 0.5s; }
        .edge.animated { stroke-dasharray: 5, 5; animation: dash 20s linear infinite; }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Detail panel */
        #detail-panel { margin-top: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9; display: none; }
        #detail-title { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Clustered Microservices Architecture</h1>
    <p>Interactive visualization showing different routing and load balancing strategies for clustered microservices.</p>

    <div class="controls">
        <button class="btn active" onclick="setArchitecture('api-gateway')">API Gateway</button>
        <button class="btn" onclick="setArchitecture('service-mesh')">Service Mesh</button>
        <button class="btn" onclick="setArchitecture('client-side')">Client-side LB</button>
    </div>

    <div class="viz-container">
        <svg id="arch-viz" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" width="100%">
            <!-- Definitions for markers and animations -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#999" />
                </marker>
                <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#326ce5" />
                </marker>
            </defs>

            <!-- This content will be dynamically generated by JS -->
            <g id="viz-content"></g>
        </svg>
    </div>

    <div id="detail-panel">
        <h3 id="detail-title">Component Details</h3>
        <p id="detail-desc">Select a component in the diagram above to see details.</p>
    </div>

    <script>
        const architectures = {
            'api-gateway': {
                nodes: [
                    { id: 'client', x: 50, y: 200, width: 80, height: 40, rx: 4, fill: '#eee', label: 'Client', desc: 'External client making a request.' },
                    { id: 'lb', x: 200, y: 200, width: 100, height: 60, rx: 30, fill: '#f6d365', label: 'Load Balancer', desc: 'Distributes incoming external traffic.' },
                    { id: 'gateway', x: 380, y: 200, width: 100, height: 60, rx: 4, fill: '#ff9a9e', label: 'API Gateway', desc: 'Handles routing, auth, and rate limiting.' },

                    { id: 'svc-a1', x: 600, y: 100, width: 90, height: 40, rx: 4, fill: '#a1c4fd', label: 'Service A (v1)', desc: 'Instance 1 of Service A.' },
                    { id: 'svc-a2', x: 600, y: 160, width: 90, height: 40, rx: 4, fill: '#a1c4fd', label: 'Service A (v2)', desc: 'Instance 2 of Service A.' },
                    { id: 'svc-b1', x: 600, y: 240, width: 90, height: 40, rx: 4, fill: '#84fab0', label: 'Service B', desc: 'Instance 1 of Service B.' },
                    { id: 'svc-b2', x: 600, y: 300, width: 90, height: 40, rx: 4, fill: '#84fab0', label: 'Service B', desc: 'Instance 2 of Service B.' }
                ],
                edges: [
                    { from: 'client', to: 'lb' },
                    { from: 'lb', to: 'gateway' },
                    { from: 'gateway', to: 'svc-a1', animated: true },
                    { from: 'gateway', to: 'svc-a2', animated: true },
                    { from: 'gateway', to: 'svc-b1', animated: true },
                    { from: 'gateway', to: 'svc-b2', animated: true }
                ],
                desc: "An API Gateway handles all incoming requests and routes them to the appropriate backend microservices, often acting as a reverse proxy."
            },
            'service-mesh': {
                nodes: [
                    { id: 'client', x: 50, y: 200, width: 80, height: 40, rx: 4, fill: '#eee', label: 'Client', desc: 'External client making a request.' },
                    { id: 'ingress', x: 200, y: 200, width: 100, height: 60, rx: 4, fill: '#f6d365', label: 'Ingress Proxy', desc: 'Entry point to the service mesh.' },

                    { id: 'svc-a-pod', x: 400, y: 120, width: 180, height: 80, rx: 4, fill: '#f9f9f9', label: '', desc: 'Pod containing Service A and its sidecar.', isGroup: true },
                    { id: 'proxy-a', x: 420, y: 140, width: 60, height: 40, rx: 4, fill: '#cfd9df', label: 'Proxy', desc: 'Envoy/Linkerd sidecar proxy.' },
                    { id: 'svc-a', x: 500, y: 140, width: 60, height: 40, rx: 4, fill: '#a1c4fd', label: 'Service A', desc: 'Application logic.' },

                    { id: 'svc-b-pod', x: 400, y: 240, width: 180, height: 80, rx: 4, fill: '#f9f9f9', label: '', desc: 'Pod containing Service B and its sidecar.', isGroup: true },
                    { id: 'proxy-b', x: 420, y: 260, width: 60, height: 40, rx: 4, fill: '#cfd9df', label: 'Proxy', desc: 'Envoy/Linkerd sidecar proxy.' },
                    { id: 'svc-b', x: 500, y: 260, width: 60, height: 40, rx: 4, fill: '#84fab0', label: 'Service B', desc: 'Application logic.' },

                    { id: 'control-plane', x: 400, y: 30, width: 180, height: 40, rx: 4, fill: '#e0c3fc', label: 'Control Plane', desc: 'Manages proxy configuration and policies.' }
                ],
                edges: [
                    { from: 'client', to: 'ingress' },
                    { from: 'ingress', to: 'proxy-a', animated: true },
                    { from: 'ingress', to: 'proxy-b', animated: true },
                    { from: 'proxy-a', to: 'svc-a' },
                    { from: 'proxy-b', to: 'svc-b' },
                    { from: 'proxy-a', to: 'proxy-b', animated: true, color: '#326ce5' },
                    { from: 'control-plane', to: 'proxy-a', dashed: true },
                    { from: 'control-plane', to: 'proxy-b', dashed: true },
                    { from: 'control-plane', to: 'ingress', dashed: true }
                ],
                desc: "A Service Mesh uses sidecar proxies deployed alongside applications to handle all service-to-service communication, managed by a control plane."
            },
            'client-side': {
                nodes: [
                    { id: 'client', x: 100, y: 200, width: 120, height: 80, rx: 4, fill: '#eee', label: '', desc: 'Client application containing the LB logic.', isGroup: true },
                    { id: 'client-app', x: 110, y: 210, width: 100, height: 30, rx: 4, fill: '#fff', label: 'Client App', desc: 'The main client application.' },
                    { id: 'client-lb', x: 110, y: 250, width: 100, height: 20, rx: 4, fill: '#f6d365', label: 'Internal LB', desc: 'Library handling load balancing (e.g., Ribbon).' },

                    { id: 'registry', x: 350, y: 100, width: 120, height: 50, rx: 4, fill: '#e0c3fc', label: 'Service Registry', desc: 'Maintains list of available service instances (e.g., Eureka, Consul).' },

                    { id: 'svc-1', x: 600, y: 150, width: 90, height: 40, rx: 4, fill: '#a1c4fd', label: 'Instance 1', desc: 'Service instance 1.' },
                    { id: 'svc-2', x: 600, y: 220, width: 90, height: 40, rx: 4, fill: '#a1c4fd', label: 'Instance 2', desc: 'Service instance 2.' },
                    { id: 'svc-3', x: 600, y: 290, width: 90, height: 40, rx: 4, fill: '#a1c4fd', label: 'Instance 3', desc: 'Service instance 3.' }
                ],
                edges: [
                    { from: 'client-lb', to: 'registry', dashed: true, desc: 'Fetch endpoints' },
                    { from: 'svc-1', to: 'registry', dashed: true, desc: 'Register' },
                    { from: 'svc-2', to: 'registry', dashed: true, desc: 'Register' },
                    { from: 'svc-3', to: 'registry', dashed: true, desc: 'Register' },
                    { from: 'client-lb', to: 'svc-1', animated: true },
                    { from: 'client-lb', to: 'svc-2', animated: true },
                    { from: 'client-lb', to: 'svc-3', animated: true }
                ],
                desc: "Client-side load balancing puts the routing logic inside the client application itself, which queries a service registry to find available endpoints."
            }
        };

        function renderArchitecture(archId) {
            const arch = architectures[archId];
            const svg = document.getElementById('viz-content');
            svg.innerHTML = ''; // Clear existing

            // Draw edges first so they are behind nodes
            arch.edges.forEach(edge => {
                const fromNode = arch.nodes.find(n => n.id === edge.from);
                const toNode = arch.nodes.find(n => n.id === edge.to);

                if (!fromNode || !toNode) return;

                // Calculate connection points (simplified center to center)
                const x1 = fromNode.x + fromNode.width / 2;
                const y1 = fromNode.y + fromNode.height / 2;
                const x2 = toNode.x + toNode.width / 2;
                const y2 = toNode.y + toNode.height / 2;

                // Adjust points to node boundaries (rough approximation)
                const angle = Math.atan2(y2 - y1, x2 - x1);
                const startX = x1 + Math.cos(angle) * (fromNode.width/2);
                const startY = y1 + Math.sin(angle) * (fromNode.height/2);
                const endX = x2 - Math.cos(angle) * (toNode.width/2 + 5); // +5 for marker
                const endY = y2 - Math.sin(angle) * (toNode.height/2 + 5);

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

                // Handle curves or straight lines
                let d = '';
                if (Math.abs(startX - endX) > 100 && Math.abs(startY - endY) > 50) {
                    // Curved line
                    const cpX = startX + (endX - startX) / 2;
                    d = `M ${startX} ${startY} C ${cpX} ${startY}, ${cpX} ${endY}, ${endX} ${endY}`;
                } else {
                    // Straight line
                    d = `M ${startX} ${startY} L ${endX} ${endY}`;
                }

                path.setAttribute('d', d);

                let classes = 'edge';
                if (edge.animated) classes += ' animated';
                path.setAttribute('class', classes);

                if (edge.dashed) path.setAttribute('stroke-dasharray', '5,5');
                if (edge.color) {
                    path.setAttribute('stroke', edge.color);
                    path.setAttribute('marker-end', 'url(#arrow-active)');
                } else {
                    path.setAttribute('marker-end', 'url(#arrow)');
                }

                svg.appendChild(path);
            });

            // Draw nodes
            arch.nodes.forEach(node => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', node.x);
                rect.setAttribute('y', node.y);
                rect.setAttribute('width', node.width);
                rect.setAttribute('height', node.height);
                rect.setAttribute('rx', node.rx);
                rect.setAttribute('fill', node.fill);
                rect.setAttribute('class', 'node');

                if (node.isGroup) {
                    rect.setAttribute('stroke-dasharray', '4,4');
                    rect.setAttribute('stroke', '#ccc');
                    rect.setAttribute('fill', 'transparent');
                }

                // Add click handler
                rect.addEventListener('click', () => showDetails(node));

                g.appendChild(rect);

                if (node.label) {
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', node.x + node.width / 2);
                    text.setAttribute('y', node.y + node.height / 2);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'middle');
                    text.setAttribute('font-size', node.isGroup ? '10px' : '12px');
                    text.setAttribute('pointer-events', 'none'); // Let clicks pass through to rect

                    if (node.isGroup) {
                        text.setAttribute('y', node.y + 12);
                    }

                    text.textContent = node.label;
                    g.appendChild(text);
                }

                svg.appendChild(g);
            });

            // Reset details panel
            document.getElementById('detail-panel').style.display = 'block';
            document.getElementById('detail-title').textContent = archId.replace('-', ' ').toUpperCase();
            document.getElementById('detail-desc').textContent = arch.desc;
        }

        function showDetails(node) {
            const panel = document.getElementById('detail-panel');
            document.getElementById('detail-title').textContent = node.label || node.id;
            document.getElementById('detail-desc').textContent = node.desc;
            panel.style.display = 'block';
        }

        function setArchitecture(archId) {
            // Update buttons
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Render
            renderArchitecture(archId);
        }

        // Initialize
        renderArchitecture('api-gateway');
    </script>
</body>
</html>
